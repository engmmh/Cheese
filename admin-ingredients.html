<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="theme-toggle.js"></script>
<title>إدارة المكونات — لوحة التحكم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="padding-top:30px; padding-bottom:60px;">
  <div class="admin-header">
    <h1 style="margin:0;">إدارة المكونات ومسببات الحساسية<span class="label-en">Ingredients &amp; Allergens</span></h1>
    <a href="admin-dashboard.html" class="btn btn-secondary btn-sm">رجوع للوحة التحكم<span class="label-en">Back</span></a>
  </div>

  <div class="panel">
    <form id="add-ingredient-form" style="display:flex; gap:10px; flex-wrap:wrap;">
      <input type="text" id="new-ingredient-name" placeholder="اسم المكون بالإنجليزي / English name" style="flex:1; min-width:160px;">
      <input type="text" id="new-ingredient-name-ar" placeholder="الاسم بالعربي / Arabic name" style="flex:1; min-width:140px;">
      <input type="text" id="new-ingredient-icon" placeholder="إيموجي / Icon" style="width:110px;">
      <select id="new-ingredient-category" style="width:180px;">
        <option value="ألبان">ألبان</option>
        <option value="دقيق ومخبوزات">دقيق ومخبوزات</option>
        <option value="سكريات ومحليات">سكريات ومحليات</option>
        <option value="بيض">بيض</option>
        <option value="دهون وزيوت">دهون وزيوت</option>
        <option value="فواكه">فواكه</option>
        <option value="شوكولاتة">شوكولاتة</option>
        <option value="مكسرات">مكسرات</option>
        <option value="نكهات وتوابل">نكهات وتوابل</option>
        <option value="مواد مضافة">مواد مضافة</option>
        <option value="أخرى">أخرى</option>
      </select>
      <input type="number" step="any" id="new-ingredient-cost" placeholder="السعر / Price" style="width:100px;">
      <select id="new-ingredient-cost-unit" style="width:90px;">
        <option value="g">لكل جرام g</option>
        <option value="kg">لكل كيلو kg</option>
        <option value="ml">لكل مل ml</option>
        <option value="l">لكل لتر l</option>
        <option value="pcs">لكل قطعة pcs</option>
      </select>
      <button class="btn btn-primary btn-sm" type="submit">إضافة<span class="label-en">Add</span></button>
    </form>
  </div>

  <p style="font-size:0.85rem; color:var(--ink-soft);">
    حدد مسببات الحساسية اللي بتنطبق على كل مكون. أي وصفة تستخدم المكون ده، هتظهر مسببات الحساسية دي تلقائيًا تحتها.
    
  </p>

  <table class="admin-table">
    <thead>
      <tr>
        <th>المكون<span class="label-en">Ingredient</span></th>
        <th>💰 السعر<span class="label-en">Price</span></th>
        <th>مسببات الحساسية<span class="label-en">Allergens</span></th>
        <th colspan="2">إجراءات<span class="label-en">Actions</span></th>
      </tr>
    </thead>
    <tbody id="ingredients-tbody">
      <tr><td colspan="3">جاري التحميل...</td></tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-auth-guard.js"></script>
<script src="admin-ingredients-logic.js"></script>
</body>
</html>
