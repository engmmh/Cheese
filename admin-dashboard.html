<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="theme-toggle.js"></script>
<title>لوحة التحكم — دفتر الوصفات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="admin-header">
    <div>
      <div style="font-family:var(--font-display); font-size:1.4rem; font-weight:600;">لوحة التحكم<span class="label-en">Admin Panel</span></div>
      <div style="font-size:0.85rem; color:var(--ink-soft);" id="user-email"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="admin-ingredients.html" class="btn btn-secondary btn-sm">إدارة المكونات<span class="label-en">Ingredients</span></a>
      <a href="index.html" class="btn btn-secondary btn-sm">عرض الموقع<span class="label-en">View site</span></a>
      <button class="btn btn-secondary btn-sm" onclick="adminLogout()">خروج<span class="label-en">Logout</span></button>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
    <div class="dash-filter-tabs" id="dash-filter-tabs">
      <button class="dash-tab active" data-filter="all">الكل<span class="label-en">All</span></button>
      <button class="dash-tab" data-filter="final">✅ منتجات نهائية<span class="label-en">Final</span></button>
      <button class="dash-tab" data-filter="sub">🧩 وصفات فرعية<span class="label-en">Sub-recipes</span></button>
      <button class="dash-tab" data-filter="missing">⚠ بيانات ناقصة<span class="label-en">Missing data</span></button>
    </div>
    <a href="admin-recipe-form.html" class="btn btn-primary">+ إضافة وصفة جديدة<span class="label-en">Add recipe</span></a>
  </div>

  <table class="admin-table">
    <thead>
      <tr>
        <th>🍽 الاسم<span class="label-en">Name</span></th>
        <th>🏷 التصنيف<span class="label-en">Category</span></th>
        <th>النوع<span class="label-en">Type</span></th>
        <th>⚠ الحالة<span class="label-en">Status</span></th>
        <th>إجراءات<span class="label-en">Actions</span></th>
      </tr>
    </thead>
    <tbody id="recipes-tbody">
      <tr><td colspan="5">جاري التحميل...</td></tr>
    </tbody>
  </table>

  <h2 class="section-title" style="margin-top:50px;">إدارة التصنيفات<span class="label-en">Manage Categories</span></h2>
  <div class="panel" style="max-width:420px;">
    <form id="add-category-form" style="display:flex; gap:10px; margin-bottom:16px;">
      <input type="text" id="new-category-name" placeholder="اسم تصنيف جديد / New category name" required>
      <input type="text" id="new-category-name-en" placeholder="English name">
      <button class="btn btn-primary btn-sm" type="submit">إضافة<span class="label-en">Add</span></button>
    </form>
    <div id="categories-manage-list"></div>
  </div>
</div>

<footer class="site-footer">لوحة التحكم — دفتر الوصفات<span class="label-en">Admin Panel — Recipe Book</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-auth-guard.js"></script>
<script src="admin-dashboard.js"></script>
</body>
</html>
