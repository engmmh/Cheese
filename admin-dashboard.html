<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — دفتر الوصفات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="admin-header">
    <div>
      <div style="font-family:var(--font-display); font-size:1.4rem; font-weight:600;">لوحة التحكم</div>
      <div style="font-size:0.85rem; color:var(--ink-soft);" id="user-email"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="admin-ingredients.html" class="btn btn-secondary btn-sm">إدارة المكونات</a>
      <a href="index.html" class="btn btn-secondary btn-sm">عرض الموقع</a>
      <button class="btn btn-secondary btn-sm" onclick="adminLogout()">خروج</button>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2 class="section-title" style="padding-bottom:0; margin:0;">كل الوصفات</h2>
    <a href="admin-recipe-form.html" class="btn btn-primary">+ إضافة وصفة جديدة</a>
  </div>

  <table class="admin-table">
    <thead>
      <tr>
        <th>🍽 الاسم</th>
        <th>🏷 التصنيف</th>
        <th>النوع</th>
        <th>⚠ الحالة</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="recipes-tbody">
      <tr><td colspan="5">جاري التحميل...</td></tr>
    </tbody>
  </table>

  <h2 class="section-title" style="margin-top:50px;">إدارة التصنيفات</h2>
  <div class="panel" style="max-width:420px;">
    <form id="add-category-form" style="display:flex; gap:10px; margin-bottom:16px;">
      <input type="text" id="new-category-name" placeholder="اسم تصنيف جديد (مثال: أجبان)" required>
      <input type="text" id="new-category-name-en" placeholder="بالإنجليزي (اختياري)">
      <button class="btn btn-primary btn-sm" type="submit">إضافة</button>
    </form>
    <div id="categories-manage-list"></div>
  </div>
</div>

<footer class="site-footer">لوحة التحكم — دفتر الوصفات</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-auth-guard.js"></script>
<script src="admin-dashboard.js"></script>
</body>
</html>
